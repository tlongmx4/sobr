name: Purge crisis flags

# Deletes CrisisFlag rows older than the retention window (14 days). The endpoint
# itself enforces the cutoff; this workflow just triggers it daily and fails loudly
# if it cannot reach it. Monitor the first few weeks of runs (see TODO.md): GitHub
# scheduled workflows can lag under load and auto-disable after 60 days of repo
# inactivity.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Hit purge endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PURGE_ENDPOINT_URL: ${{ secrets.PURGE_ENDPOINT_URL }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${PURGE_ENDPOINT_URL}")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Purge request failed"
            exit 1
          fi
